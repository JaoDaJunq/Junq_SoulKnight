      .label{font-size:15px;letter-spacing:2px;fill:#b9d4d7;font-weight:700}
      .small{font-size:16px;fill:#b9d4d7}
      .title{font-size:44px;font-weight:900;letter-spacing:5px}
      .card{fill:#111d2b;stroke:#42616b;stroke-width:2}
    </style>
