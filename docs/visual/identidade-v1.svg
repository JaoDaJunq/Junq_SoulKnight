<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Prancha conceitual original para Junq Ruptura: abertura, seleção, combate, paleta e silhuetas">
  <defs>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#0b1522"/><stop offset="1" stop-color="#22202d"/></linearGradient>
    <linearGradient id="atrium" x2="1" y2="1"><stop stop-color="#1b3444"/><stop offset="1" stop-color="#111e30"/></linearGradient>
    <linearGradient id="forge" x2="1" y2="1"><stop stop-color="#332630"/><stop offset="1" stop-color="#68404a"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#f5ad72" stop-opacity=".55"/><stop offset="1" stop-color="#f5ad72" stop-opacity="0"/></radialGradient>
    <pattern id="tile" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#78dce0" stroke-opacity=".09" stroke-width="2"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
